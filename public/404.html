<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada | Blogbaza</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      :root {
        --bg-black: #000000;
        --surface-dark: #0a0a0a;
        --xbox-green: #107c10;
        --xbox-red: #ff3333;
        --text-main: #ffffff;
        --text-secondary: #888888;
        --border-color: rgba(255, 255, 255, 0.1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--bg-black);
        color: var(--text-main);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow-x: hidden;
      }

      #main-content {
        width: 100%;
        padding: 20px;
        display: flex;
        justify-content: center;
      }

      .error-page-section {
        width: 100%;
        max-width: 700px;
        text-align: center;
        padding: 40px 20px;
      }

      .xbox-error-ring {
        width: 110px;
        height: 110px;
        border: 6px solid #1a1a1a;
        border-radius: 50%;
        margin: 0 auto 25px auto;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 30px rgba(255, 51, 51, 0.15);
        animation: ringPulse 2s infinite ease-in-out;
      }

      .xbox-quadrant {
        position: absolute;
        width: 42px;
        height: 42px;
        border-radius: 50%;
      }

      /* rojos de error */
      .q1 { top: 6px; left: 6px; background-color: var(--xbox-red); animation: blinkRed 1s infinite alternate; }
      .q2 { top: 6px; right: 6px; background-color: var(--xbox-red); animation: blinkRed 1s infinite alternate 0.3s; }
      .q3 { bottom: 6px; left: 6px; background-color: var(--xbox-red); animation: blinkRed 1s infinite alternate 0.6s; }
      .q4 { bottom: 6px; right: 6px; background-color: var(--xbox-green); box-shadow: 0 0 12px var(--xbox-green); }

      @keyframes blinkRed {
        0% { opacity: 0.3; box-shadow: none; }
        100% { opacity: 1; box-shadow: 0 0 15px var(--xbox-red); }
      }

      @keyframes ringPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }

      /* Animación */
      .avatar-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 90px;
        margin-bottom: 15px;
      }

      .xbox-avatar-svg {
        width: 75px;
        height: 75px;
        animation: floatAvatar 3s ease-in-out infinite;
        filter: drop-shadow(0 5px 15px rgba(16, 124, 16, 0.3));
      }

      .wrench-tool {
        transform-origin: 45px 45px;
        animation: swingWrench 1.5s ease-in-out infinite alternate;
      }

      @keyframes floatAvatar {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(-2deg); }
      }

      @keyframes swingWrench {
        0% { transform: rotate(-15deg); }
        100% { transform: rotate(25deg); }
      }

      /* Texto Glitch 404 */
      .glitch-text {
        font-size: clamp(4rem, 12vw, 6.5rem);
        font-weight: 900;
        color: var(--text-main);
        position: relative;
        letter-spacing: 6px;
        margin-bottom: 5px;
        text-shadow: 3px 3px var(--xbox-red), -3px -3px var(--xbox-green);
        animation: glitchAnim 4s infinite linear;
      }

      @keyframes glitchAnim {
        0% { text-shadow: 3px 3px var(--xbox-red), -3px -3px var(--xbox-green); }
        2% { text-shadow: -3px 3px var(--xbox-green), 3px -3px var(--xbox-red); }
        4% { text-shadow: 3px -3px var(--xbox-red), -3px -3px var(--xbox-green); }
        6% { text-shadow: 3px 3px var(--xbox-red), -3px -3px var(--xbox-green); }
        100% { text-shadow: 3px 3px var(--xbox-red), -3px -3px var(--xbox-green); }
      }

      .error-message {
        font-size: clamp(1.2rem, 3vw, 1.6rem);
        color: #fff;
        margin-bottom: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .error-description {
        color: var(--text-secondary);
        font-size: clamp(0.9rem, 2vw, 1rem);
        line-height: 1.6;
        margin-bottom: 30px;
        padding: 0 10px;
      }

      /* Buscador Global */
      .global-search-container {
        position: relative;
        width: 100%;
        max-width: 480px;
        margin: 0 auto 30px auto;
        text-align: left;
      }

      .search-input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
        background: var(--surface-dark);
        border: 2px solid var(--border-color);
        border-radius: 10px;
        padding: 4px 14px;
        transition: all 0.3s ease;
      }

      .search-input-wrapper:focus-within {
        border-color: var(--xbox-green);
        box-shadow: 0 0 15px rgba(16, 124, 16, 0.25);
      }

      .search-icon {
        width: 20px;
        height: 20px;
        color: var(--text-secondary);
        margin-right: 10px;
        flex-shrink: 0;
      }

      #globalPageSearchInput {
        width: 100%;
        background: transparent;
        border: none;
        outline: none;
        color: #fff;
        font-size: 0.95rem;
        padding: 10px 0;
      }

      #globalPageSearchInput::placeholder {
        color: var(--text-secondary);
      }

      .clear-search-btn {
        background: transparent;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4px;
        transition: color 0.2s;
      }

      .clear-search-btn:hover {
        color: #fff;
      }

      .clear-search-btn.hidden, .global-search-results.hidden {
        display: none;
      }

      /* Resultados Desplegables */
      .global-search-results {
        position: absolute;
        top: calc(100 + 8px);
        left: 0;
        right: 0;
        background: #0d0d0d;
        border: 1px solid var(--border-color);
        border-radius: 10px;
        max-height: 320px;
        overflow-y: auto;
        z-index: 100;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
        padding: 6px;
        margin-top: 6px;
      }

      .search-result-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px;
        border-radius: 8px;
        text-decoration: none;
        color: #fff;
        transition: background 0.2s;
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      }

      .search-result-item:last-child {
        border-bottom: none;
      }

      .search-result-item:hover {
        background: rgba(16, 124, 16, 0.15);
      }

      .search-result-icon {
        width: 36px;
        height: 36px;
        border-radius: 6px;
        object-fit: cover;
        background: #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        color: var(--xbox-green);
      }

      .search-result-info {
        flex: 1;
        overflow: hidden;
      }

      .search-result-title {
        font-size: 0.88rem;
        font-weight: 600;
        margin: 0 0 2px 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .search-result-type {
        font-size: 0.7rem;
        color: var(--xbox-green);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 700;
      }

      .search-no-results {
        padding: 14px;
        text-align: center;
        color: var(--text-secondary);
        font-size: 0.88rem;
      }

      /* Botón de Retorno */
      .error-actions {
        display: flex;
        justify-content: center;
      }

      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: var(--xbox-green);
        color: #fff;
        padding: 12px 26px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
        transition: all 0.2s ease;
        box-shadow: 0 4px 15px rgba(16, 124, 16, 0.3);
      }

      .btn-primary:hover {
        background-color: #0e6b0e;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(16, 124, 16, 0.5);
      }

      /* Móviles */
      @media (max-width: 480px) {
        .error-page-section {
          padding: 20px 10px;
        }
        .xbox-error-ring {
          width: 90px;
          height: 90px;
        }
        .xbox-quadrant {
          width: 34px;
          height: 34px;
        }
      }
    </style>
</head>
<body>

<main id="main-content">
    <section class="error-page-section">
        <!-- (luces de error) -->
        <div class="xbox-error-ring">
            <div class="xbox-quadrant q1"></div>
            <div class="xbox-quadrant q2"></div>
            <div class="xbox-quadrant q3"></div>
            <div class="xbox-quadrant q4"></div>
        </div>

        <!-- Avatar  -->
        <div class="avatar-container">
            <svg class="xbox-avatar-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Cabeza del Avatar -->
                <circle cx="50" cy="30" r="16" fill="#22c55e" stroke="#000" stroke-width="2"/>
                <!-- Cuerpo / Sudadera -->
                <path d="M30 75C30 58 38 52 50 52C62 52 70 58 70 75V85H30V75Z" fill="#15803d" stroke="#000" stroke-width="2"/>
                <!-- herramienta -->
                <path d="M32 58L20 70L28 78" stroke="#22c55e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- Herramienta (Llave inglesa animada) -->
                <g class="wrench-tool" transform="translate(45, 45)">
                    <rect x="-3" y="-18" width="6" height="22" rx="2" fill="#94a3b8" stroke="#000" stroke-width="1.5"/>
                    <circle cx="0" cy="-18" r="6" fill="#94a3b8" stroke="#000" stroke-width="1.5"/>
                    <circle cx="0" cy="-18" r="2.5" fill="#000"/>
                </g>
            </svg>
        </div>

        <h1 class="glitch-text" data-text="404">404</h1>
        <h2 class="error-message">Sistema Fuera de Línea</h2>
        <p class="error-description">
            La ruta solicitada no se encuentra disponible o el sistema ha colapsado en esta dimensión. Utiliza el buscador para localizar contenido o regresa al menú principal.
        </p>

        <!-- Buscador Global Conectado Automáticamente -->
        <div class="global-search-container">
            <div class="search-input-wrapper">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="globalPageSearchInput" placeholder="Busca posts, herramientas, videos..." autocomplete="off">
                <button id="clearGlobalSearchBtn" class="clear-search-btn hidden">
                    <i data-lucide="x" style="width: 16px; height: 16px;"></i>
                </button>
            </div>
            <div id="globalSearchResults" class="global-search-results hidden"></div>
        </div>

        <div class="error-actions">
            <a href="/index.html" class="btn-primary">
                <i data-lucide="home" style="width: 18px; height: 18px; margin-right: 8px;"></i> Volver al Inicio
            </a>
        </div>
    </section>
</main>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (window.lucide) lucide.createIcons();

    const globalInput = document.getElementById('globalPageSearchInput');
    const clearBtn = document.getElementById('clearGlobalSearchBtn');
    const resultsBox = document.getElementById('globalSearchResults');

    let cachedGlobalData = { posts: [], repos: [], videos: [], noticias: [] };
    let isDataLoaded = false;

    async function preloadSiteData() {
      if (isDataLoaded) return;
      const API_BASE = 'https://rxtiobaza-data.onrender.com';
      const FALLBACK = 'https://raw.githubusercontent.com/RXxsk/Blogbaza/main/data';

      try {
        const fetchJSON = async (endpoint, file) => {
          try {
            let res = await fetch(`${API_BASE}${endpoint}`);
            if (!res.ok) throw new Error();
            return await res.json();
          } catch {
            let res = await fetch(`${FALLBACK}/${file}`);
            return await res.json();
          }
        };

        const [postsRes, reposRes, videosRes, noticiasRes] = await Promise.all([
          fetchJSON('/api/posts', 'posts.json'),
          fetchJSON('/api/repos', 'repos.json'),
          fetchJSON('/api/videos', 'videos.json'),
          fetchJSON('/api/noticias', 'noticias.json')
        ]);

        cachedGlobalData.posts = Array.isArray(postsRes) ? postsRes : (postsRes.posts || postsRes.data || []);
        cachedGlobalData.repos = Array.isArray(reposRes) ? reposRes : (reposRes.repos || reposRes.data || []);
        cachedGlobalData.videos = Array.isArray(videosRes) ? videosRes : (videosRes.videos || videosRes.data || []);
        cachedGlobalData.noticias = Array.isArray(noticiasRes) ? noticiasRes : (noticiasRes.noticias || noticiasRes.data || []);
        
        isDataLoaded = true;
      } catch (e) {
        console.error('Error al sincronizar datos del sitio:', e);
      }
    }

    if (globalInput) {
      globalInput.addEventListener('focus', preloadSiteData);
      globalInput.addEventListener('input', async (e) => {
        const query = e.target.value.toLowerCase().trim();
        if (clearBtn) clearBtn.classList.toggle('hidden', query === '');

        if (!query) {
          resultsBox.classList.add('hidden');
          resultsBox.innerHTML = '';
          return;
        }

        if (!isDataLoaded) {
          resultsBox.innerHTML = '<div class="search-no-results">Sincronizando base de datos...</div>';
          resultsBox.classList.remove('hidden');
          await preloadSiteData();
        }

        const matchedPosts = cachedGlobalData.posts.filter(p => (p.titulo || p.title || '').toLowerCase().includes(query)).map(p => ({
          title: p.titulo || p.title,
          type: 'Post',
          url: `/post.html`,
          img: p.coverUrl || p.cover || ''
        }));

        const matchedRepos = cachedGlobalData.repos.filter(r => (r.titulo || r.title || '').toLowerCase().includes(query)).map(r => ({
          title: r.titulo || r.title,
          type: 'Herramienta',
          url: r.downloadUrl || '#',
          img: r.logoUrl || r.avatar || ''
        }));

        const matchedVideos = cachedGlobalData.videos.filter(v => (v.titulo || v.title || '').toLowerCase().includes(query)).map(v => ({
          title: v.titulo || v.title,
          type: 'Video',
          url: v.youtubeUrl || v.url || '#',
          img: v.thumbnail || `https://img.youtube.com/vi/${v.youtubeId || ''}/hqdefault.jpg`
        }));

        const allResults = [...matchedPosts, ...matchedRepos, ...matchedVideos].slice(0, 5);

        if (allResults.length === 0) {
          resultsBox.innerHTML = '<div class="search-no-results">No se encontraron registros coincidentes.</div>';
        } else {
          resultsBox.innerHTML = allResults.map(item => `
            <a href="${item.url}" class="search-result-item">
              <div class="search-result-icon">
                <i data-lucide="file-code" style="width: 18px; height: 18px;"></i>
              </div>
              <div class="search-result-info">
                <p class="search-result-title">${item.title}</p>
                <span class="search-result-type">${item.type}</span>
              </div>
              <i data-lucide="chevron-right" style="width: 16px; height: 16px; color: var(--text-secondary);"></i>
            </a>
          `).join('');
          if (window.lucide) lucide.createIcons();
        }

        resultsBox.classList.remove('hidden');
      });
    }

    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        globalInput.value = '';
        clearBtn.classList.add('hidden');
        resultsBox.classList.add('hidden');
        resultsBox.innerHTML = '';
      });
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.global-search-container')) {
        if (resultsBox) resultsBox.classList.add('hidden');
      }
    });
  </script>
</script>
</body>
</html>
